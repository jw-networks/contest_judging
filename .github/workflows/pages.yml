name: Deploy site and app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['public/**', 'site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # GitHub's recommended layout: upload in one job, deploy in another. Doing both in one
  # job can make the deploy step miss the artifact it just uploaded ("No artifacts named
  # github-pages were found").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The website is the site root; the judging app (public/) is served at /app/.
      - name: Put the site and the app together
        run: |
          mkdir _site
          cp -r site/. _site/
          cp -r public _site/app

      - name: Point the app at the API
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::warning::Repository variable API_URL is not set, so the app won't know where the server is."
            exit 0
          fi
          case "$API_URL" in https://*) ;; *) echo "::error::API_URL must start with https://"; exit 1;; esac
          node -e 'require("fs").writeFileSync("_site/app/config.js", "window.APP_CONFIG = " + JSON.stringify({ serverUrl: process.env.API_URL.replace(/\/+$/, "") }) + ";\n")'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
